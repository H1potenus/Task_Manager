name: Windows exe derle ve yayınla

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Exe derle
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TaskPlannerPomodoro `
            --icon assets/icon.ico --add-data "assets/icon.ico;assets" `
            --collect-all customtkinter --hidden-import matplotlib.backends.backend_tkagg main.py

      - uses: actions/upload-artifact@v4
        with:
          name: TaskPlannerPomodoro-windows
          path: dist/TaskPlannerPomodoro.exe

      - name: Release oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TaskPlannerPomodoro.exe
          generate_release_notes: true
