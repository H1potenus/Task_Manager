name: Windows exe derle ve yayınla

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Yayınlanacak sürüm etiketi (ör. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Exe derle
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name TaskPlannerPomodoro `
            --icon assets/icon.ico --add-data "assets/icon.ico;assets" `
            --collect-all customtkinter --hidden-import matplotlib.backends.backend_tkagg main.py

      - uses: actions/upload-artifact@v4
        with:
          name: TaskPlannerPomodoro-windows
          path: dist/TaskPlannerPomodoro.exe

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: Task Planner / Pomodoro Timer ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          files: dist/TaskPlannerPomodoro.exe
          generate_release_notes: true
